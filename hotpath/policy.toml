# Docs: https://hotpath.rs/cloud

[functions]
min_percent_total = 0.05

# Thresholds carried over from mbrotli, whose Callgrind counts varied by at
# most 0.045% across runs of one commit. Allocations are deterministic too.
[functions.icount]
judged = true
min_percent_change = 0.5
metrics = ["avg", "total"]
min_calls = 1

[functions.alloc]
judged = true
min_percent_change = 1
metrics = ["avg", "total"]
min_calls = 1

[functions.timing]
judged = false
min_percent_change = 50
metrics = ["avg", "total"]
min_calls = 1
