name: CI Benchmarks

# Run on demand from the Actions tab or the GitHub CLI.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark-smoke:
    name: benchmarks compile and validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Every benchmark checks its output against zstd before timing, so a
      # short run is a differential check as well as a smoke test. Numbers
      # from a shared runner are not evidence.
      - run: cargo bench --locked --bench compress -- --sample-size 10 --warm-up-time 1 --measurement-time 2
      - run: cargo bench --locked --bench decompress -- --sample-size 10 --warm-up-time 1 --measurement-time 2
      - run: cargo bench --locked -p mzstd-ffi --bench one_shot -- --test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: criterion-${{ matrix.os }}
          path: target/criterion
