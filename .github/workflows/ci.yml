name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A differential failure is worth the full backtrace it takes to place.
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, docs and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # all-features turns on no_std, which removes the std-only modules, so
      # the default feature set is linted as well.
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --features hotpath-cpu,hotpath-alloc --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --features framed --locked -- -D warnings
      - name: clippy for every codec and std combination
        run: |
          for features in std,compression std,decompression no_std,compression no_std,decompression std,compression,framed std,decompression,framed no_std,compression,framed no_std,decompression,framed ""; do
            echo "::group::features '$features'"
            cargo clippy -p mzstd --all-targets --no-default-features --features "$features" --locked -- -D warnings
            echo "::endgroup::"
          done
      - name: docs for every codec and std combination
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --locked
          for features in std,compression std,decompression no_std,compression,decompression std,compression,framed std,decompression,framed std,compression,decompression,framed; do
            cargo doc -p mzstd --no-deps --no-default-features --features "$features" --locked
          done
      - run: cargo package -p mzstd --allow-dirty --locked

  no-std:
    name: no_std host tests and bare-metal compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p mzstd --lib --no-default-features --features compression,decompression,no_std --target thumbv7em-none-eabi
      - run: cargo test -p mzstd --release --no-default-features --features compression,decompression,no_std --locked

  test:
    name: test on ${{ matrix.os }} (${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        toolchain: [stable]
        include:
          # The MSRV `Cargo.toml` declares, checked on one target.
          - os: ubuntu-latest
            toolchain: "1.89"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # The differential suites are far too slow without optimizations.
      - run: cargo test --workspace --release --locked
      - run: cargo test --workspace --all-features --release --locked
      # all-features turns on no_std, so the std framed adapters are tested here.
      - run: cargo test --workspace --features framed --release --locked

  overflow-correction:
    name: differential suites with frequent index overflow correction
    runs-on: ubuntu-latest
    env:
      # Read at build time by both mzstd and the vendored C library.
      MZSTD_OVERFLOW_CORRECT_FREQUENTLY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-overflow-correction
      - run: cargo test -p mzstd --release --lib --locked compressor::core

  fuzz:
    name: fuzz targets and their regression corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz/afl
          # cargo-afl uses target-cpu=native, including for build scripts.
          # Hosted runners can have different CPUs; never reuse these artifacts.
          cache-targets: false
          prefix-key: v1-afl-no-targets
      - name: install cargo-afl
        run: cargo install cargo-afl --version 0.18.2 --locked --force
      - name: build AFL runtime for the active Rust toolchain
        run: cargo afl config --build --force
      - name: check
        working-directory: fuzz/afl
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --no-default-features -- -D warnings
          cargo clippy --all-targets --no-default-features --features framed -- -D warnings
      # `cargo afl test` rather than `cargo test`: the fuzz binaries link AFL's
      # runtime, so plain `cargo test` cannot link them.
      - name: replay the regression corpus
        working-directory: fuzz/afl
        run: |
          cargo afl test --release --no-default-features
          cargo afl test --release --no-default-features --features framed
