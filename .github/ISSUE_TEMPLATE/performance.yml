name: Performance regression
description: mzstd is slower than zstd 1.5.7, or slower than an earlier mzstd release, on a workload.
labels: ["performance"]
body:
  - type: textarea
    id: workload
    attributes:
      label: Workload
      description: The input (or a description of it), its size, the API, and the configuration.
    validations:
      required: true
  - type: textarea
    id: measurements
    attributes:
      label: Measurements
      description: |
        The command or benchmark you ran, and the before/after or mzstd/zstd
        numbers for both throughput and compressed size. Release builds only.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mzstd version or commit
      placeholder: 0.2.8
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Target, CPU, and OS
      placeholder: x86_64-unknown-linux-gnu, AMD Ryzen 9 7950X, Ubuntu 24.04
    validations:
      required: true
