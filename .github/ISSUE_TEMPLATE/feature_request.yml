name: Feature request
description: Suggest a new API, parameter, or capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Some zstd features are deliberately unsupported; see "Not supported" in
        the [README](https://github.com/M-Compressors/mzstd#not-supported).
        A request for one of them is still welcome if you explain the use case.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you would like. If zstd has an equivalent, name it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this myself.
