[package]
name = "mzstd-afl"
version = "0.1.0"
edition = "2024"
publish = false
description = "AFL++ fuzz targets for the mzstd encoder and decoder"

[dependencies]
afl = "0.18"

[dependencies.mzstd]
path = "../.."

[dependencies.zstd-ffi]
path = "../../zstd-ffi"

[features]
default = []
# Opt-in targets for mzstd's framed containers; the stable configuration
# builds and replays without them.
framed = ["mzstd/framed"]

[profile.release]
debug = true
codegen-units = 1

[workspace]

[[bin]]
name = "framed_encode"
path = "src/bin/framed_encode.rs"
required-features = ["framed"]

[[bin]]
name = "framed_decode"
path = "src/bin/framed_decode.rs"
required-features = ["framed"]

[[bin]]
name = "framed_roundtrip"
path = "src/bin/framed_roundtrip.rs"
required-features = ["framed"]
