[package]
name = "mzstd-ffi"
version = "0.2.6"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "C ABI for mzstd: one-shot Zstandard compression and decompression"
repository = "https://github.com/M-Compressors/mzstd"
homepage = "https://github.com/M-Compressors/mzstd"
readme = "README.md"
keywords = ["zstd", "zstandard", "compression", "ffi", "c"]
categories = ["compression", "external-ffi-bindings"]
include = ["src/**", "include/**", "README.md"]

[lib]
# `cdylib` and `staticlib` are what C links against; `rlib` lets the Rust
# integration tests call the exported symbols directly.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies.mzstd]
path = ".."
version = "0.2.6"
default-features = false
features = ["std", "compression", "decompression"]

[dependencies.thiserror]
version = "2"

[dev-dependencies.zstd-ffi]
path = "../zstd-ffi"

[dev-dependencies.criterion]
version = "0.8"

[[bench]]
name = "one_shot"
harness = false
