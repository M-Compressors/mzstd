[package]
name = "zstd-ffi"
version = "0.1.0"
edition = "2024"
links = "zstd"
license = "BSD-3"
description = "Raw Rust FFI bindings to the vendored Zstandard C library, used as the mzstd test oracle"
homepage = "https://github.com/facebook/zstd"
publish = false
include = [
    "src/**",
    "shim/**",
    "build.rs",
    "README.md",
    "UPSTREAM_VERSION",
    "vendor/zstd/LICENSE",
    "vendor/zstd/lib/common/**",
    "vendor/zstd/lib/compress/**",
    "vendor/zstd/lib/decompress/**",
    "vendor/zstd/lib/dictBuilder/**",
    "vendor/zstd/lib/zdict.h",
    "vendor/zstd/lib/zstd.h",
    "vendor/zstd/lib/zstd_errors.h",
    "vendor/zstd/contrib/seekable_format/zstd_seekable.h",
    "vendor/zstd/contrib/seekable_format/zstdseek_compress.c",
    "vendor/zstd/contrib/seekable_format/zstdseek_decompress.c",
]

[build-dependencies]
cc = "1.2"
