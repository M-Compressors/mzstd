# The crates alef generates from `mzstd-bindings`. They form their own
# workspace, excluded from the repository one, so the generated binding
# crates, their `rustfmt.toml` and their toolchain never affect `mzstd`'s
# own checks; `.github/workflows/ci-bindings.yml` builds and tests them.
[workspace]
members = [
  "crates/mzstd-bindings-node",
  "crates/mzstd-bindings-py",
  "crates/mzstd-bindings-wasm",
]
resolver = "3"

[workspace.lints]

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(alef)", 'cfg(feature, values("alef-meta"))'] }

[profile.release]
lto = true
codegen-units = 1
